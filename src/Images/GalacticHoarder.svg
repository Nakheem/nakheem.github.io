<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" shape-rendering="crispEdges">
  <rect width="200" height="200" fill="#140A2E"/>
  <!-- stars -->
  <g fill="#FFFFFF">
    <rect x="14" y="18" width="4" height="4"/>
    <rect x="172" y="12" width="4" height="4"/>
    <rect x="40" y="70" width="3" height="3"/>
    <rect x="160" y="64" width="3" height="3"/>
    <rect x="186" y="110" width="4" height="4"/>
    <rect x="10" y="120" width="3" height="3"/>
    <rect x="100" y="8" width="3" height="3"/>
  </g>
  <!-- tractor beam -->
  <polygon points="84,62 116,62 150,150 50,150" fill="#C02FD0" opacity="0.35"/>
  <!-- UFO -->
  <rect x="84" y="26" width="32" height="16" fill="#8FE3FF"/>
  <rect x="88" y="22" width="24" height="4" fill="#8FE3FF"/>
  <rect x="56" y="42" width="88" height="14" fill="#702FD0"/>
  <rect x="68" y="56" width="64" height="8" fill="#D02F8F"/>
  <rect x="64" y="46" width="8" height="6" fill="#FFE14D"/>
  <rect x="96" y="46" width="8" height="6" fill="#FFE14D"/>
  <rect x="128" y="46" width="8" height="6" fill="#FFE14D"/>
  <!-- abducted block in the beam -->
  <g fill="#FFE14D">
    <rect x="88" y="92" width="12" height="12"/>
    <rect x="100" y="92" width="12" height="12"/>
    <rect x="100" y="80" width="12" height="12"/>
  </g>
  <!-- container floor, stacked blocks -->
  <rect x="30" y="150" width="140" height="6" fill="#FFFFFF"/>
  <rect x="30" y="188" width="140" height="6" fill="#FFFFFF"/>
  <rect x="30" y="150" width="6" height="44" fill="#FFFFFF"/>
  <rect x="164" y="150" width="6" height="44" fill="#FFFFFF"/>
  <g fill="#36D6A0">
    <rect x="36" y="176" width="12" height="12"/>
    <rect x="48" y="176" width="12" height="12"/>
    <rect x="60" y="176" width="12" height="12"/>
    <rect x="72" y="176" width="12" height="12"/>
  </g>
  <g fill="#FF7A3D">
    <rect x="84" y="176" width="12" height="12"/>
    <rect x="96" y="176" width="12" height="12"/>
    <rect x="96" y="164" width="12" height="12"/>
    <rect x="108" y="164" width="12" height="12"/>
  </g>
  <g fill="#4DA3FF">
    <rect x="108" y="176" width="12" height="12"/>
    <rect x="120" y="176" width="12" height="12"/>
    <rect x="132" y="176" width="12" height="12"/>
    <rect x="132" y="164" width="12" height="12"/>
  </g>
  <g fill="#D02F8F">
    <rect x="144" y="176" width="12" height="12"/>
    <rect x="144" y="164" width="12" height="12"/>
    <rect x="152" y="176" width="12" height="12"/>
  </g>
