# Netlify build config, version-controlled so it isn't only in the dashboard.
# Vite (unlike CRA) doesn't fail the build on lint warnings, so no CI=false needed.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  # Vite 8 / Rolldown needs Node >= 20.19. Netlify still defaults to Node 18 (EOL).
  NODE_VERSION = "22"
